name: Manually publish Python distribution

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication target
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      confirmation:
        description: Type publish to authorize external publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install audio verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Build locked artifacts
        run: |
          uv sync --frozen --dev
          uv run pytest -q
          uv run ruff check src
          uv run pyright
          uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    if: inputs.confirmation == 'publish' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/elevenlabs-mcp-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    if: inputs.confirmation == 'publish' && inputs.target == 'pypi' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/elevenlabs-mcp-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: inputs.confirmation == 'publish' && inputs.target == 'pypi' && startsWith(github.ref, 'refs/tags/')
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/*
      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --generate-notes
          gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}'
