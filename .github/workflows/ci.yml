name: Credential-free CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install audio verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install locked development environment
        run: uv sync --frozen --dev
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
      - name: Run credential-free tests
        run: uv run pytest -q
      - name: Lint runtime
        run: uv run ruff check src
      - name: Type check
        run: uv run pyright
      - name: Build distributions
        run: uv build

  container:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - name: Build actual CLI image
        run: docker build -t elevenlabs-revival:local .
      - name: Verify isolated non-root container with persistent state
        run: uv run python scripts/smoke_container.py
