# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Honor bounded 429 Retry-After while preventing automatic synthesis replay after read timeout or connection reset with an unknown upstream outcome.
description: |
  R02/A28-A31 uncertainty child. Add public UpstreamOutcomeUnknownError with
  operation, sanitized cause type, and retryable=false. Synthesis ReadTimeout
  and generic ConnectionError dispatch once and raise this type; ConnectTimeout
  retains the existing bounded three attempts because transmission was not
  established. Numeric Retry-After on 429 controls Tenacity sleep but is capped
  to 0..10 seconds; invalid/missing values use the existing exponential wait.
  Both legacy job paths persist the typed unknown message and return it through
  the already-sanitized error envelope so blind automatic replay is not
  encouraged. Metadata read retries remain unchanged. The subsequently evolved
  bounded-HTTP contract applies the same typed one-dispatch uncertainty policy
  to synthesis 500/502/503/504 while preserving metadata 5xx retries. Original
  red evidence: ReadTimeout/ConnectionError each dispatched
  three times and no typed unknown error exists; 429 sleeps use exponential
  values rather than Retry-After.
temptations:
  - risk: Retry every RequestException because Tenacity already bounds attempts.
    instead: Retry ConnectTimeout only; classify read timeout and connection reset as unknown after one actual POST dispatch.
  - risk: Trust an arbitrary Retry-After value and sleep without a ceiling.
    instead: Accept numeric values only in the inclusive 0..10 second range and otherwise use the bounded exponential wait.
  - risk: Store a generic failed job that loses uncertainty semantics.
    instead: Persist the sanitized UpstreamOutcomeUnknownError text and surface retryable=false through its public field.
  - risk: Let dependent uncertainty guidance drift after an approved retry-policy evolution.
    instead: Refresh dependent lock hashes and narrative metadata while preserving the original uncertainty red evidence.
type: fix
