# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Generate fresh timezone-aware UTC timestamps per AudioJob and provide an injectable clock for new server-created jobs without changing legacy history fields.
description: |
  First R02 child covering A06 timestamp correctness only. Replace evaluated
  dataclass datetime defaults with per-instance UTC factories. Add a public
  AudioJob.create factory whose Callable clock is invoked once so created_at
  and updated_at share an injected deterministic instant. Normalize historical
  naive timestamps to timezone-aware UTC during from_dict while leaving stored
  rows untouched and preserving the exact legacy to_dict field set. Narrow
  server wiring uses AudioJob.create at both legacy generation call sites.
  Output naming, partial generation, HTTP policy, logging, and migration remain
  separate children. Expected red: two directly constructed jobs currently
  share the same evaluated datetime objects, timestamps are naive, and
  AudioJob.create does not exist.
temptations:
  - risk: Fix only one timestamp field or call the injected clock separately for created_at and updated_at.
    instead: Capture one aware UTC instant in AudioJob.create and assign it to both fields; use independent default factories for direct construction.
  - risk: Add timestamp provenance keys to the legacy to_dict response and break existing client history parsing.
    instead: Normalize naive values in memory while preserving the existing nine serialized history fields; richer migration provenance belongs to R05.
  - risk: Rewrite historical database timestamp strings during reads.
    instead: Interpret naive values as UTC in AudioJob.from_dict without database writes.
type: fix
