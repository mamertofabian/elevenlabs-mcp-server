    - command: [uv, run, --with, coverage, maid, verify, --profile, deep, --manifest-dir, manifests, --test-scope, task, --file-tracking-scope, task, --require-plan-lock, --require-red-evidence, --since, HEAD, --summary, --packet]
      status: passed
      summary: All 11 deep gates passed, including artifact coverage, knockout, plan-lock/red-evidence integrity, file tracking, and changed scope.
