# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Atomically reserve cumulative request and character exposure in a durable generation-attempt ledger before provider dispatch.
description: |
  Third R05 child covering A26's durable budget boundary. Add immutable
  AttemptReservation, JobNotFoundError, ChunkNotFoundError, and
  AttemptConflictError plus JobStore.reserve_attempt. In one BEGIN IMMEDIATE
  transaction, resolve an existing attempt ID first for exact replay, reject
  reuse against another job/chunk, load the owned pending chunk and active job,
  verify stored cumulative request/character ceilings, require a queued/running
  job and pending chunk, increment both reserved counters, and insert the
  reserved attempt while leaving the chunk pending until actual dispatch. Concurrent
  reservations cannot overspend. Failed ceiling checks persist nothing and
  keep earlier exposure. This method performs no provider dispatch, retry
  classification, artifact write, revision mutation, resume policy, or refund.
  Expected red: reservation DTO/errors/method absent.
temptations:
  - risk: Check budget in application memory and insert the attempt afterward.
    instead: Hold BEGIN IMMEDIATE from ledger read through job counter update, attempt insert, chunk state update, and commit.
  - risk: Refund failed or uncertain attempts by decrementing reservations.
    instead: Treat every committed reservation as cumulative dispatch exposure; later outcome updates never erase it.
  - risk: Count original script characters rather than exact request character_count.
    instead: Read the immutable owned chunk count inside the transaction and reserve that amount plus one request.
  - risk: Double-charge a retried local call with the same attempt ID.
    instead: Return the original reservation before budget/state checks when job and chunk ownership match.
type: feature
