      artifacts:
        - kind: class
          name: AttemptReservation
          bases: [_StrictModel]
        - {kind: attribute, name: attempt_id, of: AttemptReservation, type: str}
        - {kind: attribute, name: job_id, of: AttemptReservation, type: str}
        - {kind: attribute, name: chunk_id, of: AttemptReservation, type: str}
        - {kind: attribute, name: reserved_characters, of: AttemptReservation, type: int}
        - {kind: attribute, name: reserved_requests, of: AttemptReservation, type: int}
        - {kind: attribute, name: replayed, of: AttemptReservation, type: bool}
    - path: src/elevenlabs_mcp/database.py
      artifacts:
        - kind: class
          name: JobNotFoundError
          bases: [RuntimeError]
        - {kind: attribute, name: job_id, of: JobNotFoundError, type: str}
        - kind: class
          name: ChunkNotFoundError
          bases: [RuntimeError]
        - {kind: attribute, name: job_id, of: ChunkNotFoundError, type: str}
        - {kind: attribute, name: chunk_id, of: ChunkNotFoundError, type: str}
        - kind: class
          name: AttemptConflictError
          bases: [RuntimeError]
        - {kind: attribute, name: attempt_id, of: AttemptConflictError, type: str}
        - kind: class
          name: ReservationStateError
          bases: [RuntimeError]
        - {kind: attribute, name: job_id, of: ReservationStateError, type: str}
        - {kind: attribute, name: chunk_id, of: ReservationStateError, type: str}
        - {kind: attribute, name: job_status, of: ReservationStateError, type: str}
        - {kind: attribute, name: chunk_status, of: ReservationStateError, type: str}
        - kind: method
          name: reserve_attempt
          of: JobStore
          async: true
          args:
            - {name: self, type: JobStore}
            - {name: job_id, type: str}
            - {name: chunk_id, type: str}
            - {name: attempt_id, type: str}
            - {name: started_at, type: datetime}
          returns: AttemptReservation
    - path: tests/integration/test_attempt_budget_reservation.py
      artifacts:
        - kind: test_function
          name: test_reserve_attempt_atomically_updates_job_chunk_and_ledger
          description: Exact owned chunk characters and one request are reserved with aware time, durable attempt state, chunk state, per-attempt exposure result, and cumulative job totals before dispatch.
        - kind: test_function
          name: test_attempt_id_replay_is_exact_and_conflicting_owner_fails
          description: Matching attempt ID returns original cumulative reservation without recounting; reuse for another chunk raises AttemptConflictError.
        - kind: test_function
          name: test_concurrent_reservations_cannot_exceed_cumulative_ceiling
          description: Separate JobStore instances racing under a one-request ceiling commit exactly one attempt and one exposure while the other receives BudgetExceededError.
        - kind: test_function
          name: test_missing_job_or_chunk_and_invalid_attempt_leave_ledger_unchanged
          description: Typed missing ownership and invalid attempt IDs create no attempts and do not alter stored reservation counters or chunk state.
        - kind: test_function
          name: test_ineligible_job_or_chunk_state_is_preserved_without_reservation
          description: Completed/cancelled/paused jobs and non-pending chunks raise ReservationStateError with exact state evidence, persist no attempt, and retain counters/status.
