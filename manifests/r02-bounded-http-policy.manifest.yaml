  - [uv, run, pytest, -q, tests/acceptance/test_bounded_http_policy.py, tests/acceptance/test_credential_free_discovery.py]
  - [uv, run, ruff, check, tests/acceptance/test_bounded_http_policy.py]
  - [uv, run, pyright, tests/acceptance/test_bounded_http_policy.py]
