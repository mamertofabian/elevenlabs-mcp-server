# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Bound legacy HTTP connect/read time and prevent retries for deterministic provider 4xx responses while preserving existing retry behavior elsewhere.
description: |
  R02 transport-policy child covering finite HTTP limits and the deterministic
  portion of A12/A27. Both get_voices and generate_audio_segment pass an exact
  finite (connect, read) timeout to Requests. Provider 400/401/403/404/422
  responses raise a private non-retryable error at the response boundary and
  dispatch exactly once beneath Tenacity. 429 and 5xx behavior remains on the
  existing bounded three-attempt path for a later Retry-After/uncertainty child;
  request-exception classification, sanitized error envelopes, and SDK
  migration are explicitly deferred. Successful response shapes and public
  method signatures remain unchanged. Expected red: captured Requests calls
  have no timeout and deterministic 401/422 responses dispatch three times.
temptations:
  - risk: Assert only that the decorated public method raises.
    instead: Count calls inside fake requests.get/post and assert deterministic failures dispatch exactly once.
  - risk: Mark every 4xx non-retryable, including 429.
    instead: Exclude only 400, 401, 403, 404, and 422; preserve current 429 retries for the dedicated Retry-After contract.
  - risk: Add a timeout to one endpoint but leave metadata or synthesis unbounded.
    instead: Capture and assert the same finite tuple on both requests.get and requests.post.
  - risk: Reclassify timeouts/read resets while adding timeout arguments.
    instead: Leave RequestException retry semantics unchanged for the later unknown-outcome child.
type: fix
files:
  edit:
    - path: src/elevenlabs_mcp/elevenlabs_api.py
      artifacts:
        - kind: method
          name: get_voices
          of: ElevenLabsAPI
          args:
            - name: self
          returns: List[VoiceData]
        - kind: method
          name: generate_audio_segment
          of: ElevenLabsAPI
          args:
            - name: self
            - name: text
              type: str
            - name: voice_id
              type: str
            - name: output_file
              type: Optional[str]
              default: None
            - name: previous_text
              type: Optional[str]
              default: None
            - name: next_text
              type: Optional[str]
              default: None
            - name: previous_request_ids
              type: Optional[List[str]]
              default: None
            - name: debug_info
              type: Optional[List[str]]
              default: None
          returns: tuple[bytes, str]
    - path: tests/acceptance/test_bounded_http_policy.py
      artifacts:
        - kind: test_function
          name: test_voice_metadata_uses_finite_timeout_and_one_401_dispatch
          description: A12 captures the GET timeout tuple and proves a 401 response reaches requests.get exactly once.
        - kind: test_function
          name: test_synthesis_uses_finite_timeout_and_one_422_dispatch
          description: A27 captures the POST timeout tuple and proves a 422 response reaches requests.post exactly once.
        - kind: test_function
          name: test_server_failures_retain_bounded_three_attempt_policy
          description: Fake 500 responses still dispatch three times for metadata and synthesis, proving this child did not broaden retry reclassification.
  read:
    - manifests/r01-credential-free-discovery.manifest.yaml
    - docs/revival/02_ENGINEERING_SPEC.md
    - docs/revival/04_ACCEPTANCE_AND_RELEASE.md
    - tests/acceptance/test_credential_free_discovery.py
