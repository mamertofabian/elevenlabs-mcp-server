  - [uv, run, pytest, -q, tests/acceptance/test_explicit_dotenv_startup.py, tests/acceptance/test_runtime_configuration.py, tests/acceptance/test_credential_free_discovery.py]
  - [uv, run, ruff, check, src/elevenlabs_mcp/config.py, tests/acceptance/test_explicit_dotenv_startup.py]
  - [uv, run, pyright, src/elevenlabs_mcp/config.py, tests/acceptance/test_explicit_dotenv_startup.py]
acceptance:
  tests:
    - [uv, run, pytest, -q, tests/acceptance/test_explicit_dotenv_startup.py]
  immutable: true
outcome:
  status: completed
  summary: Import-time dotenv loading is removed; startup now reads only launch_cwd/.env once, disables ambient interpolation, overlays operator values, and passes the resulting mapping directly to Settings and ElevenLabsAPI without mutating process state.
  rationale: Explicit composition preserves local .env convenience and operator precedence while preventing parent-directory searches, ambient-secret interpolation, and environment-variable coordination between classes.
  lessons:
    - lesson_type: configuration-isolation
      summary: An explicit dotenv path is not fully isolated unless interpolation is disabled; otherwise values can still resolve from ambient os.environ despite an isolated input mapping.
      tags: [dotenv, configuration, secrets, startup]
      paths:
