# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Make legacy assembled-audio filenames collision-proof and atomically non-overwriting by tying them to UUID job identity instead of wall-clock seconds.
description: |
  R02/A07 child. Extend ElevenLabsAPI.generate_full_audio with an optional
  output_id. Server call sites pass their existing job UUID; direct legacy
  callers that omit it receive a generated UUID. Only canonical UUID text may
  become a filename. Assembly exports to a same-directory temporary file and
  atomically links it into the final full_audio_<uuid>.mp3 path without
  replacing an existing artifact, then cleans temporary state. This preserves
  the return tuple and legacy synchronous tool envelopes while removing
  second-resolution collisions and path injection. Partial-generation truth,
  codec verification, and broader artifact ownership remain later children.
  Expected red: two renders use the same timestamp filename, output_id is not
  accepted, and a repeated identity can overwrite the first artifact.
temptations:
  - risk: Add microseconds or randomness to the old timestamp filename.
    instead: Use the already-persisted job UUID from server call sites and generate a UUID only for backward-compatible direct callers.
  - risk: Interpolate arbitrary caller text into a filesystem path.
    instead: Parse output_id as UUID and use its canonical string form only.
  - risk: Check Path.exists before a normal export and call that non-overwriting.
    instead: Export to a same-directory temporary file and use an atomic no-replace link operation for finalization.
  - risk: Leave temporary encoded files after export or finalization failure.
    instead: Remove the owned temporary path in a finally block while never deleting an existing final artifact.
type: fix
files:
  edit:
    - path: src/elevenlabs_mcp/elevenlabs_api.py
      artifacts:
        - kind: method
          name: generate_full_audio
          of: ElevenLabsAPI
          args:
            - name: self
            - name: script_parts
              type: List[Dict]
            - name: output_dir
              type: Path
            - name: output_id
              type: Optional[str]
              default: None
          returns: tuple[str, List[str], int]
    - path: tests/acceptance/test_collision_proof_output.py
      artifacts:
        - kind: test_function
          name: test_distinct_job_ids_create_distinct_files_in_same_clock_second
          description: A07 produces two different final paths and bytes for explicit UUID job identities independent of wall-clock time.
        - kind: test_function
          name: test_repeated_job_id_never_overwrites_existing_audio
          description: Reusing one UUID raises FileExistsError and preserves the original final bytes.
        - kind: test_function
          name: test_omitted_output_id_uses_unique_uuid_filenames
          description: Backward-compatible direct calls without output_id receive distinct canonical UUID filenames.
        - kind: test_function
          name: test_invalid_output_id_cannot_create_paths
          description: Non-UUID and traversal-like identifiers fail before output-directory or provider work.
        - kind: test_function
          name: test_legacy_server_tools_publish_with_persisted_job_ids
          description: Real in-memory MCP calls for both legacy generation tools persist jobs whose output filenames contain those same job UUIDs.
        - kind: test_function
          name: test_export_and_link_failures_cleanup_temporary_files
          description: Export and non-collision finalization failures leave no temporary or final artifact and do not disturb existing files.
  read:
