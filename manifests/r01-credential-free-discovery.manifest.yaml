# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Allow credential-free server construction and stdio discovery while rejecting provider operations before any network request when the API key is missing.
description: |
  Third implementation-sized R01 child covering the credential-free discovery
  portion of A05. Preserve ElevenLabsAPI defaults and the six legacy tools, but
  stop requiring ELEVENLABS_API_KEY in the API constructor. Public metadata and
  synthesis helpers reject a missing key before Requests dispatch, and server
  initialization skips voice-cache warming when no key is configured so real
  stdio initialize/list-tools/shutdown works without credentials or FFmpeg.
  This child does not introduce the final typed error envelope, change retry
  classification for provider failures, repair logging/debug leakage, or alter
  generation result semantics; those remain R02 children.
  Because elevenlabs_api.py was previously uncovered, this child declares and
  characterizes its complete public VoiceData and ElevenLabsAPI surface.
  Expected red: ElevenLabsAPI() and ElevenLabsServer() currently raise before
  discovery when the key is empty, so the real stdio client closes before it
  can list the six legacy tools.
  Outcome lesson applied: the real child process redirects writable roots,
  disables bytecode, uses an empty key that dotenv cannot override, installs a
  fail-closed socket guard, and bounds MCP initialization.
temptations:
  - risk: Use a fake API key in the discovery test and call the result credential-free.
    instead: Remove ELEVENLABS_API_KEY from the child environment, run a real MCP stdio session, and assert the six tool names.
  - risk: Catch missing credentials only after Requests or tenacity begins retrying.
    instead: Check for the key at the public API method boundary with a non-retryable ValueError before requests.get or requests.post.
  - risk: Return placeholder voices or silently claim cache freshness when no key exists.
    instead: Skip startup warming only; retain an empty/stale cache state and let explicit metadata calls surface the missing-key failure.
  - risk: Expand this seam into retry, error-envelope, logging, or provider-SDK redesign.
    instead: Preserve existing successful request/response behavior with fake HTTP characterization and leave R02/R06 contracts separate.
type: fix
