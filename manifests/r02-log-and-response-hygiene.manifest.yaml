              default: None
          returns: tuple[bytes, str]
        - kind: method
          name: generate_full_audio
          of: ElevenLabsAPI
          args:
            - name: self
            - name: script_parts
              type: List[Dict]
            - name: output_dir
              type: Path
            - name: output_id
              type: Optional[str]
              default: None
          returns: tuple[str, List[str], int]
          raises: [PartialGenerationError]
    - path: tests/acceptance/test_log_and_response_hygiene.py
      artifacts:
        - kind: test_function
          name: test_invalid_log_level_never_writes_protocol_stdout
          description: A11 imports server/API in a bounded subprocess with an invalid log level and observes empty stdout plus a stderr diagnostic.
        - kind: test_function
          name: test_parser_debug_never_echoes_script_or_voice_values
          description: Parsed values remain intact while returned debug text contains no sentinel text, voice, or actor values.
        - kind: test_function
          name: test_provider_rejection_redacts_body_request_and_credentials
          description: A fake 422 exception and captured logs include status but exclude sentinel provider body, script, voice, and key.
        - kind: test_function
          name: test_legacy_success_line_is_preserved_without_untrusted_debug
          description: A real MCP tool success preserves the exact first line and excludes sentinel script/key/API-debug strings.
        - kind: test_function
          name: test_general_generation_failure_is_sanitized_in_job_and_response
          description: A fake exception message is absent from the real MCP response and persisted AudioJob.error while failed status remains observable.
        - kind: test_function
          name: test_startup_failure_never_writes_exception_to_stdout
          description: A sentinel-bearing initialize failure raises while stdout stays empty and stderr/log diagnostics exclude the sentinel message.
        - kind: test_function
          name: test_voice_network_failure_is_sanitized_in_api_and_tool
          description: A sentinel-bearing Requests network exception is absent from the direct API error/logs and real list_voices MCP error JSON.
