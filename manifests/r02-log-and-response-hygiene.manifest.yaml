# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Keep MCP stdout protocol-clean and prevent raw scripts, credentials, request bodies, upstream bodies, or exception messages from leaking through legacy logs and tool text.
description: |
  R02/A11/A14 hygiene child. Invalid log-level diagnostics write only to
  stderr. parse_script retains accepted text/voice/actor values but its debug
  list contains structural counts/errors rather than raw input or parts. API
  success debug is count/index/model metadata only; provider and network errors
  expose status/exception class, never response bodies, request data, text,
  voice IDs, or keys. Legacy generation responses preserve the exact first line
  "Audio generation successful. Debug info:" on full success, but ignore
  untrusted API debug and sanitize general failures in both persisted job.error
  and returned MCP text. PartialGenerationError retains its already-reviewed
  count/index/path message. Expected red: invalid log settings print to stdout,
  parser/success text echoes sentinel scripts, and a fake 422 leaks provider
  body/request text into exceptions and logs.
temptations:
  - risk: Redact only the API key while leaving raw scripts and provider bodies in debug output.
    instead: Use an allowlist of structural counts, statuses, indexes, model IDs, and exception class names; never echo arbitrary payload strings.
  - risk: Remove the legacy success signal while deleting verbose debug.
    instead: Preserve the exact first line "Audio generation successful. Debug info:" and sanitize only subsequent text.
  - risk: Put diagnostics on stdout before MCP startup.
    instead: Send invalid configuration diagnostics to stderr in both imported modules and assert subprocess stdout is empty.
  - risk: Persist raw general exception messages even if the client response is sanitized.
    instead: Store a stable generic failure string for unexpected errors; keep typed partial count/index/path detail only.
type: fix
files:
  edit:
    - path: src/elevenlabs_mcp/server.py
      artifacts:
        - kind: method
          name: parse_script
          of: ElevenLabsServer
          args:
            - name: self
            - name: script_json
              type: str
          returns: tuple[list[dict[str, Union[str, None]]], list[str]]
    - path: src/elevenlabs_mcp/elevenlabs_api.py
      artifacts:
        - kind: method
          name: get_voices
          of: ElevenLabsAPI
          args:
            - name: self
          returns: List[VoiceData]
        - kind: method
          name: generate_audio_segment
          of: ElevenLabsAPI
          args:
            - name: self
            - name: text
              type: str
            - name: voice_id
              type: str
            - name: output_file
              type: Optional[str]
              default: None
            - name: previous_text
