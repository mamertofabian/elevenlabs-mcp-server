# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Keep MCP discovery and local history responsive during synchronous legacy synthesis while serializing generation to one worker at a time.
description: |
  R02/A10 child. Add a private SDK-v1 concurrent request dispatcher plus a server generation seam guarded by one
  asyncio.Lock and execute ElevenLabsAPI.generate_full_audio through
  asyncio.to_thread. The dispatcher keeps independent MCP requests moving while a tool handler awaits its worker. Both legacy generation tools await that seam, preserving
  their synchronous response contracts and existing job transitions while the
  MCP event loop remains free for discovery/history. The lock bounds this
  recovery implementation to one active generation per server; it is not the
  durable R08 worker. Real in-memory MCP tests use a 600 ms fake blocking
  renderer and require list-tools plus history to complete within 300 ms, then
  prove concurrent legacy renders never overlap. Cancellation/unknown outcome,
  executor shutdown, and durable worker ownership remain later contracts.
  Expected red: current handlers call generate_full_audio directly, blocking
  the event loop so the metadata observation exceeds the threshold.
temptations:
  - risk: Mock the decorated handler directly and call that responsive.
    instead: Send concurrent requests through ClientSession and the real MCP Server memory streams.
  - risk: Offload synthesis but leave the SDK-v1 receive loop awaiting one handler at a time.
    instead: Use a private task-group dispatcher for registered requests while retaining request context and response/error semantics.
  - risk: Use to_thread without limiting simultaneous synthesis.
    instead: Guard the private offload seam with one asyncio.Lock and measure maximum fake-render overlap.
  - risk: Return a job ID immediately and break legacy synchronous response compatibility.
    instead: Await the offloaded render for the generation call while allowing unrelated MCP requests to progress.
  - risk: Use a timing threshold close to the fake block duration.
    instead: Block for 600 ms and require metadata under 300 ms, leaving a clear deterministic separation.
type: fix
files:
  create:
    - path: tests/acceptance/test_responsive_legacy_generation.py
      artifacts:
        - kind: test_function
          name: test_discovery_and_history_remain_responsive_during_blocked_render
          description: A10 sends a real legacy tool call while a 600 ms fake renderer blocks and observes list-tools/history within 300 ms for both simple and script tools.
        - kind: test_function
          name: test_concurrent_legacy_renders_are_serialized
          description: Concurrent real MCP generation calls complete with maximum fake-render overlap of exactly one.
        - kind: test_function
          name: test_notification_failure_does_not_stop_following_requests
          description: A raising notification handler is contained and a subsequent real MCP list-tools request succeeds, preserving SDK-v1 failure semantics.
  read:
