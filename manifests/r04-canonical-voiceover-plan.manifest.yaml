# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Produce a complete deterministic credential-free voiceover plan with canonical identity, request fingerprints, derived seeds, summaries, and explicit effective limits.
description: |
  Final R04 child covering A15 and resource-policy completion. Extend
  PlanningLimits with total-character/part/scene/cast ceilings. Add immutable
  PlannedRequest and VoiceoverPlan contracts and ScriptPlanner.plan. The planner
  normalizes only line endings, enforces effective totals, delegates lossless
  grouping, canonicalizes normalized script/resolved options/planner version/
  effective limits as stable UTF-8 sorted-key JSON, and exposes sha256 plan
  identity. Request IDs derive from plan hash and index; request fingerprints
  cover exact synthesis inputs; seeds derive as (job_seed + index) mod 2**32.
  Plans contain no timestamp, random ID, credential, path, network entitlement,
  persistence, price promise, or provider call. This child does not expose MCP
  tools or submit jobs. Expected red: PlannedRequest, VoiceoverPlan, and
  ScriptPlanner are absent and PlanningLimits lacks total ceilings.
temptations:
  - risk: Hash model reprs, timestamps, random IDs, credentials, or filesystem paths.
    instead: Hash one documented JSON value containing only normalized script, resolved options, planner version, and effective limits using sorted keys and compact UTF-8 encoding.
  - risk: Treat identical seeds as deterministic audio or reuse one seed without documenting derivation.
    instead: Record optional per-request seeds as unsigned 32-bit modular derivations and make no audio determinism claim.
  - risk: Generate request IDs before plan identity or let IDs affect the plan hash.
    instead: Compute plan hash first, then derive chk_<hash-prefix>_<index> IDs and separate request fingerprints.
  - risk: Check provider access or mutate storage while planning.
    instead: Return provider_access_checked=false and cost_estimate=None from a pure dependency-free ScriptPlanner.
  - risk: Enforce per-scene schema limits but omit job-wide part and character policy.
    instead: Count normalized text and all parts before chunking and raise PlanningLimitError with exact limit evidence.
type: feature
files:
  edit:
    - path: src/elevenlabs_mcp/contracts.py
      artifacts:
        - {kind: attribute, name: max_total_characters, of: PlanningLimits, type: int}
        - {kind: attribute, name: max_parts, of: PlanningLimits, type: int}
        - {kind: attribute, name: max_scenes, of: PlanningLimits, type: int}
        - {kind: attribute, name: max_cast_entries, of: PlanningLimits, type: int}
        - kind: class
          name: PlannedRequest
          bases: [_StrictModel]
        - {kind: attribute, name: chunk_id, of: PlannedRequest, type: str}
        - {kind: attribute, name: chunk, of: PlannedRequest, type: PlannedChunk}
        - {kind: attribute, name: seed, of: PlannedRequest, type: "int | None"}
        - {kind: attribute, name: generation_fingerprint, of: PlannedRequest, type: str}
        - kind: class
          name: VoiceoverPlan
          bases: [_StrictModel]
        - {kind: attribute, name: schema_version, of: VoiceoverPlan, type: "Literal['1']"}
        - {kind: attribute, name: plan_hash, of: VoiceoverPlan, type: str}
        - {kind: attribute, name: planner_version, of: VoiceoverPlan, type: str}
        - {kind: attribute, name: normalized_script, of: VoiceoverPlan, type: Script}
        - {kind: attribute, name: resolved_options, of: VoiceoverPlan, type: VoiceoverOptions}
        - {kind: attribute, name: effective_limits, of: VoiceoverPlan, type: PlanningLimits}
        - {kind: attribute, name: requests, of: VoiceoverPlan, type: "tuple[PlannedRequest, ...]"}
        - {kind: attribute, name: total_parts, of: VoiceoverPlan, type: int}
        - {kind: attribute, name: total_characters, of: VoiceoverPlan, type: int}
        - {kind: attribute, name: distinct_voice_count, of: VoiceoverPlan, type: int}
        - {kind: attribute, name: warnings, of: VoiceoverPlan, type: "tuple[str, ...]"}
        - {kind: attribute, name: provider_access_checked, of: VoiceoverPlan, type: "Literal[False]"}
        - {kind: attribute, name: cost_estimate, of: VoiceoverPlan, type: None}
    - path: src/elevenlabs_mcp/planner.py
      artifacts:
        - kind: class
          name: ScriptPlanner
        - kind: method
          name: plan
          of: ScriptPlanner
          args:
            - {name: self, type: ScriptPlanner}
            - {name: script, type: Script}
            - {name: options, type: VoiceoverOptions}
            - {name: limits, type: PlanningLimits}
          returns: VoiceoverPlan
    - path: tests/acceptance/test_canonical_voiceover_plan.py
      artifacts:
        - kind: test_function
          name: test_identical_input_produces_independently_reproducible_plan_hash
          description: Supplied fixture plans byte-stably twice and plan_hash equals an independently serialized canonical payload digest without credentials or I/O.
        - kind: test_function
          name: test_line_ending_equivalence_and_other_text_changes_affect_identity
          description: CRLF/CR normalize to LF identity while preserved whitespace or spoken text changes produce a different plan hash.
        - kind: test_function
          name: test_request_ids_fingerprints_and_seeds_are_stable_and_input_bound
          description: Request IDs derive from plan hash/index, modular seeds and fingerprints are stable, and option/limit changes alter identity/fingerprints.
        - kind: test_function
          name: test_plan_summaries_and_safe_preview_fields_are_complete
          description: Immutable plan exposes normalized script, resolved defaults, exact totals, distinct cast voices, requests, warnings, effective limits, false provider check, null cost, and JSON-compatible output.
        - kind: test_function
          name: test_job_wide_resource_limits_fail_before_chunking_side_effects
          description: Lowered total-character, part, scene, and cast ceilings raise PlanningLimitError with exact name/limit/actual evidence.
  read:
    - docs/revival/02_ENGINEERING_SPEC.md
    - docs/revival/03_TOOL_CONTRACTS.md
    - docs/revival/04_ACCEPTANCE_AND_RELEASE.md
    - docs/revival/examples/plan_voiceover.input.json
    - manifests/r04-typed-script-contracts.manifest.yaml
    - manifests/r04-lossless-text-fragmentation.manifest.yaml
    - manifests/r04-deterministic-chunk-grouping.manifest.yaml
