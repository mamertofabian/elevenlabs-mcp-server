          of: PlanVoiceoverInput
          type: Script
        - kind: attribute
          name: options
          of: PlanVoiceoverInput
          type: VoiceoverOptions
    - path: tests/acceptance/test_typed_script_contracts.py
      artifacts:
        - kind: test_function
          name: test_supplied_plan_fixture_validates_and_preserves_values
          description: Supplied plan input validates into every declared model, resolves defaults, preserves exact text, and round-trips to JSON-compatible data.
        - kind: test_function
          name: test_script_semantic_relationships_fail_before_planning
          description: Unknown actor, duplicate scene ID, duplicate global part ID, and whitespace-only text each raise ValidationError.
        - kind: test_function
          name: test_nested_extra_keys_and_resource_boundaries_are_rejected
          description: Extra keys, invalid identifiers, empty/oversized collections, and pause/text/cast limits are rejected at their owning model.
        - kind: test_function
          name: test_voiceover_options_enforce_engine_profiles_and_bounds
          description: Dialogue/TTS options apply explicit defaults and reject model/settings/profile/numeric/language/extra-key violations.
