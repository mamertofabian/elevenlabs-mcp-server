  summary: Strict Pydantic v2 DTOs now validate the supplied plan fixture, reject malformed or oversized scripts and options, enforce semantic actor and ID relationships, preserve exact nonblank text, serialize to JSON-compatible data, and expose a deeply immutable cast graph without side effects.
