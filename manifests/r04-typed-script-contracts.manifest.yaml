# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: "2"
goal: Add strict immutable typed script and voiceover-option contracts with semantic validation before planning or persistence.
description: |
  First R04 child covering the typed input foundation and A16. Create strict
  frozen Pydantic v2 models for CastVoice, ScriptPart, Scene, Script,
  TtsVoiceSettings, VoiceoverOptions, and PlanVoiceoverInput. Reject unknown
  fields at every level; enforce identifier, length, count, numeric, language,
  and pause limits; reject blank text; resolve every actor against cast; require
  unique scene IDs and globally unique part IDs; require dialogue model
  eleven_v3 with no TTS voice_settings. Preserve exact text content after
  validating nonblank—line-ending normalization belongs to the pure planner.
  Models perform no credential, network, filesystem, database, environment, or
  LLM access. This child does not add MCP tools, planner chunks, canonical
  hashing, persistence, or provider capabilities. Expected red: contracts.py
  and every declared public model are absent.
temptations:
  - risk: Allow extra provider dictionaries or Pydantic's default ignored fields.
    instead: Use extra='forbid' on the shared private base and assert rejection at every nested level.
  - risk: Strip or rewrite spoken text while checking for blanks.
    instead: Reject text whose strip() is empty but return the original exact string unchanged.
  - risk: Validate only JSON-schema shapes and defer actor/ID relationships.
    instead: Enforce actor resolution, unique scene IDs, and globally unique part IDs in Script model validation.
  - risk: Let dialogue options silently accept another model or TTS settings.
    instead: Require eleven_v3 and voice_settings=None whenever engine='dialogue'.
type: feature
files:
  create:
    - path: src/elevenlabs_mcp/contracts.py
      artifacts:
        - kind: class
          name: CastVoice
          bases: [_StrictModel]
        - kind: attribute
